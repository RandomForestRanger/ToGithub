<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kat en Muis</title>
  <link rel="stylesheet" href="vendor/chessground/chessground.base.css">
  <link rel="stylesheet" href="vendor/chessground/chessground.brown.css">
  <link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css">
  <link rel="stylesheet" href="css/kat-en-muis.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" aria-label="Kat en Muis">
      <span id="logo"></span>
      <span class="brand-text"><b>Kat en Muis</b><small id="modus-label">Vang die muis</small></span>
    </a>
    <div class="top-right">
    <button id="kleur" class="kleur-btn" title="Gee my 'n nuwe kleur">
      <span class="palet" aria-hidden="true"><i></i><i></i><i></i></span><span class="long">Gee my 'n nuwe kleur</span>
    </button>
    <span class="player-tag" id="speler-tag" hidden></span>
    <button id="vk-btn" class="kleur-btn" title="Vangkas" hidden>
      <span aria-hidden="true">&#x1F42D;</span><span class="long">Vangkas</span>
    </button>
    <nav class="pos-nav" id="pos-nav" aria-label="Posisies" hidden>
      <button id="vorige" class="icon-btn" title="Vorige posisie" aria-label="Vorige posisie">&#x2039;</button>
      <span id="pos-label">Posisie 1</span>
      <button id="volgende-pos" class="icon-btn" title="Volgende posisie" aria-label="Volgende posisie">&#x203a;</button>
    </nav>
    <button id="tuis-btn" class="icon-btn" title="Tuis" aria-label="Tuis" hidden>&#x2302;&#xFE0E;</button>
    </div>
  </header>

  <section class="tuis" id="tuis">
    <div class="tuis-hero">
      <div id="tuis-kuns"></div>
      <h1>Kat en Muis</h1>
      <p>Jy is die kat. Kan jy die muis vang?</p>
    </div>

    <h2>Wie speel?</h2>
    <div class="cards three" id="speler-kaarte" role="radiogroup" aria-label="Wie speel?"></div>

    <h2>Wat speel ons?</h2>
    <div class="cards two" role="radiogroup" aria-label="Wat speel ons?">
      <button class="card mode" data-mode="5" role="radio">
        <span class="mode-badge">5</span>
        <b>Mat in 5</b>
        <span>Oefen eers. Kyk hoe die kat begin, en vang dan self die muis in 5 skuiwe.</span>
      </button>
      <button class="card mode" data-mode="10" role="radio">
        <span class="mode-badge big">10</span>
        <b>Mat in 10</b>
        <span>Die regte speletjie. Van die heel begin af, 10 skuiwe.</span>
      </button>
    </div>

    <button id="begin" class="big-btn" disabled>Begin!</button>
    <button id="vk-oop" class="vk-link" hidden></button>
  </section>

  <section class="tuis vangkas" id="vangkas" hidden>
    <h1 id="vk-titel">Vangkas</h1>
    <div class="chips" role="radiogroup" aria-label="Watter speletjie?">
      <button class="chip" data-vk-mode="5" role="radio">Mat in 5</button>
      <button class="chip" data-vk-mode="10" role="radio">Mat in 10</button>
    </div>
    <div class="vk-som" id="vk-som"></div>
    <div class="vk-bar"><i id="vk-bar"></i></div>
    <div class="vk-rooster" id="vk-rooster"></div>
    <div class="vk-legend">
      <span><i class="caught"></i>Gevang</span>
      <span><i class="tried"></i>Probeer, nog nie gevang nie</span>
      <span><i class="perfect"></i>Presies</span>
      <span><i class="now"></i>Hier is jy</span>
    </div>
    <p class="vk-wenk">Tik op 'n nommer om daardie posisie te speel.</p>
    <button id="vk-terug" class="btn vk-terug">Terug</button>
  </section>

  <main class="layout" id="spel" hidden>
    <section class="board-col">
      <div class="board-frame" id="board-frame">
        <svg class="ring" id="ring" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="1" y="1" width="98" height="98" rx="1.4" pathLength="100"></rect>
        </svg>
        <div class="board-wrap">
          <div id="board" class="cg-wrap"></div>
          <div id="promo" class="promo cg-wrap" hidden></div>
          <div id="oops" class="board-pop" hidden>
            <div class="pop-card">
              <p id="oops-text"></p>
              <div class="result-buttons">
                <button id="terug" class="btn primary">Probeer 'n ander skuif</button>
                <button id="wys-my" class="btn">Wys my die kortste pad</button>
              </div>
            </div>
          </div>
          <div class="board-pop">
            <button id="wys-pad" class="big-btn" hidden>&#x25B6;&#xFE0E; Die kortste pad</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="box prompt-box">
        <div class="prompt"><span class="side-dot" id="side-dot"></span><span id="prompt"></span></div>
        <div class="hint" id="hint">Kyk eers mooi...</div>
        <button id="ek-het-dit" class="big-btn" hidden>Ek het dit!</button>
      </div>

      <div class="box handicap-box" id="handicap-box">
        <div class="label">Ekstra skuiwe</div>
        <div class="chips" role="radiogroup" aria-label="Ekstra skuiwe">
          <button class="chip" data-extra="1" role="radio">+1</button>
          <button class="chip" data-extra="3" role="radio">+3</button>
          <button class="chip" data-extra="5" role="radio">+5</button>
        </div>
      </div>

      <div class="box counter-box" id="counter-box" hidden>
        <div class="counter" id="counter">Skuif 1 van 13</div>
        <div class="pips" id="pips"></div>
        <div class="thinking" id="thinking" hidden><span></span><span></span><span></span></div>
      </div>

      <div class="box result-box" id="result-box" hidden>
        <div id="scene"></div>
        <div class="result-text" id="result-text"></div>
        <div class="stars" id="stars"></div>
        <div class="result-buttons">
          <button id="weer" class="btn">Probeer weer</button>
          <button id="volgende" class="btn primary">Volgende</button>
        </div>
      </div>

      <div class="box moves-box">
        <div class="tabs" id="tabs" hidden>
          <button class="tab active" data-view="pad">Die kortste pad</button>
          <button class="tab" data-view="jou">Jou spel</button>
        </div>
        <div class="moves" id="moves"></div>
        <div class="replay" id="replay" hidden>
          <button class="icon-btn" data-step="first" title="Begin" aria-label="Begin">&#x23EE;&#xFE0E;</button>
          <button class="icon-btn" data-step="prev" title="Terug" aria-label="Terug">&#x23F4;&#xFE0E;</button>
          <button class="icon-btn play" data-step="play" title="Speel" aria-label="Speel">&#x25B6;&#xFE0E;</button>
          <button class="icon-btn" data-step="next" title="Vorentoe" aria-label="Vorentoe">&#x23F5;&#xFE0E;</button>
          <button class="icon-btn" data-step="last" title="Einde" aria-label="Einde">&#x23ED;&#xFE0E;</button>
        </div>
      </div>

      <div class="source" id="source"></div>
    </aside>
  </main>

  <noscript>Kat en Muis het JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
