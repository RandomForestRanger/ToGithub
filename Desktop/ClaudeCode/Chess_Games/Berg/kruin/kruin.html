<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneeuluiperd se Kruin</title>
<!--
  Kaart 5-verslag (2026-07-27): sien git-geskiedenis vir Kaart 1-4 se volle
  besonderhede. Kaart 5 doen die volledige samesmelting (soos met die
  gebruiker ooreengekom): die berg-enjin (Kaart 4) is nou werklik aan
  verwerkUitkomste() gekoppel (openingsafkoms by laai, klim/daal by elke
  uitkoms, bewoner-onthulling by nuwe mylpale); Kapok se gedragstelsel +
  kunsies; Oom Jorka se volledige COACH_LINES-teksbank (>=3 variante per
  gebeurtenis, behalwe die sport-30-seremonie se een vaste sin); gesintetiseerde
  klank (wind/blaf/mat-klok, almal demp-baar). Portaal-integrasie is doelbewus
  NIE in Speletjies_Altesaam/index.html gedoen nie (nog nie ontplooi nie) --
  sien portaal-metadata.md.

  Aanvaardingstoetse geverifieer in Chromium (Playwright): elke COACH_LINES-
  gebeurtenis het 4 variante (>=3 vereis); sport-30-seremonie gee presies die
  vaste sin "Kyk. Sy het jou die hele pad dopgehou."; volle klik-gedrewe mat
  op sport 1 laat Kapok tol, die mat-klokkie speel, en die sport vorder;
  skoon-sone-styging ken die korrekte kunsie toe en dit speel by 'n
  daaropvolgende mat; klank speel niks wanneer stilgeskakel nie en die
  voorkeur oorleef 'n herlaai; regressietoetse (posisiebank-DTM, genadevenster,
  8 gedaantes, konseptuele mislukking) bly geslaag ná die volledige
  samesmelting. Let wel: die orakel-bou-tyd-hoë-plafon-toets (Kaart 1) het
  tydelik gefaal weens swaar masjienlas tydens hierdie sessie (30.4s > 15s) --
  dis 'n omgewingsklok-kwessie, nie 'n kode-regressie nie; alle ander 9
  Kaart-1-toetse (korrektheid) het steeds geslaag. Volledige verslag: sien
  gespreksgeskiedenis / oorgawe-nota vir Kaart 6.
-->
<!--
  Kaart 6-sertifiseringsverslag (2026-07-30)

  OMVANG EN METODOLOGIE: hierdie sessie het geen blaaier-outomatisering gehad
  nie (die Claude-in-Chrome-uitbreiding is nie geïnstalleer nie) -- Kaart 6 se
  oudit is dus op die REËLS-ENJIN-vlak gedoen, nie op die DOM/bord-UI-vlak
  soos Kaarte 1-5 se Playwright-toetse nie. Die oudit-skrifte (kruin/pyplyn/
  kaart6/*.js) laai die WERKLIKE produksielêers (orakel-core.js, orakel-
  worker.js, orakel.js, app.js, posisiebank.js) ongewysig in Node via `vm` +
  minimale stobbe vir blaaier-globale (self/indexedDB/Worker/performance) --
  geen speletjie- of orakel-logika is vir die oudit herskryf of nageboots
  nie. `node kruin/pyplyn/kaart6/run-alles.js` loop die volle pas; die rou
  uitset is by kruin/pyplyn/kaart6/oudit-verslag.json. 'n Volle Chromium/
  Playwright-DOM-pas (soos Kaarte 1-5) word steeds aanbeveel wanneer
  blaaier-outomatisering weer beskikbaar is.

  UITSLAG: 1128/1128 toetse geslaag, 0 gefaal.
    0. Dubbel-implementasie-konsekwentheid (build-oracle.js vs orakel-
       worker.js lewer 'n BYTE-IDENTIESE 33 554 432-sel DTM-tabel): 2/2.
    1. Posisie-oudit -- al 30 kanonieke posisies x 8 gedaantes = 240
       posisies, elk getoets vir wettigheid, >=1 wit-skuif, korrekte DTM
       (2*sport-1 plies), en nie-REMISE: 960/960.
    2. Slinkse-lyne-oudit -- al 16 gemerkte lyne (Rotse+Sneeu), elk getoets
       vir wettigheid, DTM-verkorting binne (0,4] plies, 'n bevestigde
       weerlegging (reply_hint = orakel-optimaal ná die strik), én 'n vars
       herloop van die pyplyn se eie findSwindle() sonder drif teenoor die
       verskeepte posisiebank.js: 97/97.
    3. Geskripte deurspeel-toets: (a) 'n optimale speler (altyd Orakel.
       bestMoves()[0]) klim sport 1->30, elk gemat binne presies sy DTM
       sonder enige konseptuele mislukking of begrotingoorskryding: 30/30.
       (b) 'n foutspeler het elke mislukkingsklas minstens een keer werklik
       geaktiveer -- pat-toelating, stukverlies, DTM-sprong>=8, begroting-
       oorskryding (via 'n regte tempo-mors-skuifreeks), drievoudige
       herhaling: 5/5.
    4. Regressielys: begroting-af-per-een (sport 30 misluk presies by skuif
       41, plus drie ander sones se grense): 12/12. Simmetrie-blokkleur
       (presies 4 van 8 gedaantes ruil die loper se blokkleur om; beide
       kleure kom werklik voor): 10/10. IndexedDB-kas-ongeldigmaking (warm
       kas tref, weergawe-wanverskil dwing herbou af): 4/4. localStorage-
       migrasie (ou Kaart-2-toestand kry Kaart-3-velde outomaties by, sonder
       verlies van bestaande data): 8/8.

  GEVIND EN HERSTEL TYDENS HIERDIE OUDIT-PAS: twee foute in die oudit-
  SKRIFTE self (nie in die geskeepte speletjie-kode nie) -- 'n verkeerde
  aanname dat "rotasies bly, refleksies ruil" die loperkleur-pariteit
  bepaal (die werklike D4-wiskunde verdeel dit as {0,2,6,7} bly vs
  {1,3,4,5} ruil, nie rotasie-vs-refleksie nie); en 'n te vlak beginsport
  (sport 1) wat te min "speling" het vir 'n veilige tempo-mors-soektog. Ná
  regstelling van die oudit-logika self het AL die geskeepte produksiekode
  (orakel, spel-enjin, posisiebank) sonder verdere wysiging geslaag.

  Vroeër hierdie sessie (voor Kaart 6 begin het) is 'n regte gebruikers-
  gerapporteerde fout gevind en herstel: ná 'n geslaagde klim is beginPoging()
  nooit weer geroep nie, dus het die bord nie vir die nuwe sport opgestel
  nie totdat "Begin oor" met die hand gedruk is. Herstel deur beginPoging()
  te roep sodra die klim-kamera (en enige bewoner-onthulling) klaar
  geanimeer het (kruin/app.js, voltooiUitkomste()). Deur die gebruiker in
  die regte blaaier bevestig ná die herstel.

  BYKOMEND: een toetshaak is by app.js gevoeg in dieselfde styl as die
  bestaande Kruin._xxx-hake (Kruin._laaiToestand, Kruin._STATE_KEY) om
  localStorage-migrasie DOM-vry te kan toets -- geen gedragsverandering nie.
-->
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bergAgtergrond">
    <svg id="bergSvg" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lugGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe3f5"/>
          <stop offset="55%" stop-color="#e8f4fb"/>
          <stop offset="100%" stop-color="#fdfdfb"/>
        </linearGradient>
      </defs>
      <rect id="lug" x="0" y="0" width="1200" height="800" fill="url(#lugGradient)"/>
      <g id="verre-pieke" fill="#c9d6de" stroke="#a9bac4" stroke-width="2" opacity="0.7">
        <polygon points="0,780 180,520 380,780"/>
        <polygon points="850,780 1030,480 1200,700 1200,780"/>
      </g>
      <g id="terrein" stroke="#1a1a2e" stroke-width="4" stroke-linejoin="round">
        <polygon id="strata-moeras" points="50,780 1150,780 1150,620 250,620" fill="#5b7a4f"/>
        <polygon id="strata-woud"   points="250,620 1100,620 1100,440 500,440" fill="#3f6b4a"/>
        <polygon id="strata-rotse"  points="500,440 1050,440 1050,260 750,260" fill="#8d8f92"/>
        <polygon id="strata-sneeu"  points="750,260 1030,260 1050,90" fill="#f4f7fa"/>
      </g>
      <g id="sone-grense" fill="#f39c12" stroke="#1a1a2e" stroke-width="2">
        <g id="grens-moeras-woud" transform="translate(250,620)"><circle r="10"/></g>
        <g id="grens-woud-rotse" transform="translate(500,440)"><circle r="10"/></g>
        <g id="grens-rotse-sneeu" transform="translate(750,260)"><circle r="10"/></g>
      </g>
      <path id="roete" d="M 100,760 C 350,650 700,400 1030,90"
            fill="none" stroke="#c47f2c" stroke-width="6" stroke-linecap="round"/>
      <g id="merkers"></g>
      <g id="bewoners"></g>
      <g id="klimmer">
        <circle id="klimmer-lyf" r="14" fill="#e8e8e8" stroke="#1a1a2e" stroke-width="3"/>
        <g id="kapok-sprite" transform="translate(16,8)">
          <circle id="kapok-lyf" r="7" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
        </g>
      </g>
    </svg>
  </div>

  <div id="voorgrond">
    <div id="statusPaneel" class="paneel">
      <h1>Sneeuluiperd se Kruin</h1>
      <div class="veld"><div class="etiket">Sport</div><div class="waarde" id="sportWaarde">-</div></div>
      <div class="veld"><div class="etiket">Sone</div><div class="waarde" id="soneWaarde">-</div></div>
      <div class="veld"><div class="etiket">Begroting (skuiwe oor)</div><div class="waarde" id="begrotingWaarde">-</div></div>
      <div class="veld"><div class="etiket">Gedaante (simmetrie)</div><div class="waarde" id="gedaanteWaarde">-</div></div>
      <div id="jorkaTeks"></div>
      <div id="boodskap"></div>
      <button id="weerBeginKnop">Begin oor</button>
      <button id="wysWKnop" style="display:none">Wys my die W</button>
      <label id="stilKnopLabel"><input id="stilKnop" type="checkbox"> stil (demp klank)</label>
      <div id="wOorlegsel" style="display:none"></div>
    </div>
    <div id="bordPaneel" class="paneel">
      <div id="board"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="../orakel/orakel-core.js"></script>
  <script src="../orakel/orakel.js"></script>
  <script src="../berg/berg.js"></script>
  <script src="posisiebank.js"></script>
  <script src="jorka.js"></script>
  <script src="klank.js"></script>
  <script src="app.js"></script>
</body>
</html>
