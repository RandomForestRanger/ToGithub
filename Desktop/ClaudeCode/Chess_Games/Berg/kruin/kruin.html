<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneeuluiperd se Kruin — Kaart 2+3 (Spel-enjin + Hokkleuring/Wenke)</title>
<!--
  Kaart 2-verslag (2026-07-22): sien git-geskiedenis vir volle besonderhede
  (posisiebank, genadevenster-wiskunde, konseptuele mislukking, 8 gedaantes).

  Kaart 3-verslag (2026-07-22): hokkleuring (cageSquares) met sone-vertraagde
  vervaag-in (Moeras 3s/Woud 5s/Rotse 10s/Sneeu 15s) en 'n presies-getydde
  'kruin:kleure-aangekom'-gebeurtenis vir Kaart 5 se Kapok-blaf; spoorafdruk-
  toekenning per sone (net skuiwe voor die kleure aankom); wenkstelsel (3de-
  mislukking-gloei via orakel-optimale wortel-skuif, twee-skoon-stygings-reël);
  W-oorlegsel + kontrolevraag wat nooit hek nie. §4.4 (waarna §1.4 verwys)
  bestaan nie in die spesifikasie nie -- die "ideale W" word dus self-ontwerp
  direk uit die orakel afgelei. Volledige verslag: sien gespreksgeskiedenis /
  oorgawe-nota vir Kaart 4.
-->
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Sneeuluiperd se Kruin</h1>
  <p class="subtiel">Kaart 2+3 — spel-enjin + hokkleuring/wenke (geen berg, Kapok, of Oom Jorka-teks nog nie — dis Kaart 4/5).
    Bedien via HTTP vereis.</p>

  <div id="layout">
    <div id="statusPaneel" class="paneel">
      <div class="veld"><div class="etiket">Sport</div><div class="waarde" id="sportWaarde">-</div></div>
      <div class="veld"><div class="etiket">Sone</div><div class="waarde" id="soneWaarde">-</div></div>
      <div class="veld"><div class="etiket">Begroting (skuiwe oor)</div><div class="waarde" id="begrotingWaarde">-</div></div>
      <div class="veld"><div class="etiket">Gedaante (simmetrie)</div><div class="waarde" id="gedaanteWaarde">-</div></div>
      <div id="boodskap"></div>
      <button id="weerBeginKnop">Begin oor</button>
      <button id="wysWKnop" style="display:none">Wys my die W</button>
      <div id="wOorlegsel" style="display:none"></div>
    </div>
    <div class="paneel">
      <div id="board"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="../orakel/orakel-core.js"></script>
  <script src="../orakel/orakel.js"></script>
  <script src="posisiebank.js"></script>
  <script src="app.js"></script>
</body>
</html>
